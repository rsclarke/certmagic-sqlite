version: "2"
linters:
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errorlint
    - godot
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nilnil
    - nolintlint
    - predeclared
    - rowserrcheck
    - revive
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unqueryvet
    - gosec
    # - wrapcheck
  disable:
    # Temporarily disabled while we incrementally fix existing findings.
    - errcheck
    - noctx
    - unparam
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: context-as-argument
        - name: var-naming
        - name: exported
        - name: package-comments
        - name: receiver-naming
        - name: indent-error-flow
    nolintlint:
      require-explanation: true
      require-specific: true
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
