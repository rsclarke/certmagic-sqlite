version: "2"
linters:
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errcheck
    - errorlint
    - godot
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - rowserrcheck
    - revive
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unqueryvet
    - gosec
    - unparam
    - wrapcheck
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      enable-default-rules: true
    nolintlint:
      require-explanation: true
      require-specific: true
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
